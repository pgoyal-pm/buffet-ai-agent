      services:                                                                                                                  
        stock-tracker:                                                                                                           
          image: nginx:alpine                                                                                                    
          restart: unless-stopped                                                                                                
          volumes:     
            - ./index.html:/usr/share/nginx/html/index.html:ro                                                                   
          networks:    
            - traefik-public
          labels:
            - "traefik.enable=true"
            - "traefik.http.routers.stocks.rule=Host(`stocks.buffet-ai.tech`)"
            - "traefik.http.routers.stocks.entrypoints=websecure"
            - "traefik.http.routers.stocks.tls.certresolver=letsencrypt"
            - "traefik.http.services.stocks.loadbalancer.server.port=80"
      networks:
        traefik-public:
          external: true
