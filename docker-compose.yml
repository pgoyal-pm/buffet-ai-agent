# Compounder Dashboard service - serves on /compounder/ path
# This intentionally uses a distinct path prefix so it doesn't collide with stock-api's /api/* routes
services:
  compounder-api:
    build: .
    container_name: compounder-dashboard-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/data           # Persist SQLite database
      - ./logs:/var/log/app    # Application logs
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=/data/compounder.db
      - ENVIRONMENT=production
    labels:
      - "traefik.enable=true"
      # Route all /compounder/api/* requests to this API
      - "traefik.http.routers.compounder.rule=Host(`stocks.buffet-ai.tech`) && PathPrefix(`/compounder/api`)"
      # Strip the /compounder/api prefix before forwarding to FastAPI (which expects bare /companies, /dashboard, etc.)
      - "traefik.http.middlewares.compounder-strip.stripprefix.prefixes=/compounder/api"
      - "traefik.http.routers.compounder.middlewares=compounder-strip"
      - "traefik.http.routers.compounder.entrypoints=websecure"
      - "traefik.http.routers.compounder.tls=true"
      - "traefik.http.routers.compounder.tls.certresolver=letsencrypt"
      - "traefik.http.services.compounder.loadbalancer.server.port=8000"
    networks:
      - traefik-public

  # Frontend service - serves compounder HTML at /compounder/ root
  frontend:
    image: nginx:alpine
    container_name: compounder-dashboard-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/static:/usr/share/nginx/html:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # Serve frontend at /compounder/ — exclude anything that matches /compounder/api (those go to the API)
      - "traefik.http.routers.compounder-ui.rule=Host(`stocks.buffet-ai.tech`) && PathPrefix(`/compounder`)"
      # Strip the /compounder prefix so Nginx gets /index.html etc.
      - "traefik.http.middlewares.compounder-ui-strip.stripprefix.prefixes=/compounder"
      - "traefik.http.routers.compounder-ui.middlewares=compounder-ui-strip"
      - "traefik.http.routers.compounder-ui.entrypoints=websecure"
      - "traefik.http.routers.compounder-ui.tls=true"
      - "traefik.http.routers.compounder-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.compounder-ui.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
