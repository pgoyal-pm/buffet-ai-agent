# Backend service
services:
  compounder-api:
    build: .
    container_name: compounder-dashboard-api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./data:/data           # Persist SQLite database
      - ./logs:/var/log/app    # Application logs
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=/data/compounder.db
      - ENVIRONMENT=production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compounder.rule=Host(`stocks.buffet-ai.tech`) && PathPrefix(`/api`)"
      - "traefik.http.middlewares.compounder-strip.stripprefix.prefixes=/api"
      - "traefik.http.routers.compounder.entrypoints=websecure"
      - "traefik.http.routers.compounder.tls=true"
      - "traefik.http.routers.compounder.tls.certresolver=letsencrypt"
      - "traefik.http.services.compounder.loadbalancer.server.port=8000"
    networks:
      - traefik-public

# Frontend service
  frontend:
    image: nginx:alpine
    container_name: compounder-dashboard-frontend
    restart: unless-stopped
    ports:
      - "8080:80"              # Local port for local access
    volumes:
      - ./frontend/static:/usr/share/nginx/html:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.compounder-ui.rule=Host(`stocks.buffet-ai.tech`) && !PathPrefix(`/api`)"
      - "traefik.http.routers.compounder-ui.entrypoints=websecure"
      - "traefik.http.routers.compounder-ui.tls=true"
      - "traefik.http.routers.compounder-ui.tls.certresolver=letsencrypt"
      - "traefik.http.services.compounder-ui.loadbalancer.server.port=80"
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
